<svg xmlns="http://www.w3.org/2000/svg" width="920" height="392" viewBox="0 0 920 392" role="img" aria-labelledby="dg-title dg-desc">
  <title id="dg-title">Auth: keep cookie sessions or move to JWT</title>
  <desc id="dg-desc">Today auth uses cookie sessions. Path A keeps sessions (low risk); if we ship a mobile app we add tokens for mobile, which is fine. Path B moves to JWT (high risk, tokens cannot be revoked); if we need instant logout we add a denylist, which is sessions again with critical complexity.</desc>
  <style>
    .bg{fill:#FAFAF9}
    .t{font-family:DgSans,Inter,"SF Pro Text",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;fill:#18191D}
    .title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
    .subtitle{font-size:13px;fill:#6E717A}
    .label{font-size:14px;font-weight:600}
    .sub{font-family:DgMono,"JetBrains Mono",ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:11px;fill:#7A7D86}
    .kind{font-family:DgMono,"JetBrains Mono",ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-size:9.5px;letter-spacing:0.08em;fill:#A1A4AC}
    .elabel{font-size:11px;fill:#6E717A}
    .elabel-bg{fill:#FAFAF9}
    .node{fill:#FFFFFF;stroke:#DCDDE1;stroke-width:1}
    .node.ext{fill:#FAFAF9;stroke:#B9BBC2;stroke-dasharray:4 3}
    .node.hot{stroke:#4F5BD5;stroke-width:1.5}
    .node.crit{fill:#FDF3F2;stroke:#D9483B;stroke-width:1.5}
    .node.high{fill:#FDF6EF;stroke:#DB7A2A;stroke-width:1.5}
    .node.ok{fill:#F1F8F3;stroke:#2F9A5C;stroke-width:1.5}
    .dot.crit{fill:#D9483B}.dot.high{fill:#DB7A2A}.dot.med{fill:#C69A12}.dot.ok{fill:#2F9A5C}.dot.info{fill:#3D7BD9}
    .edge{fill:none;stroke:#A3A6AE;stroke-width:1.5;stroke-linecap:butt;stroke-linejoin:round}
    .edge.hot{stroke:#4F5BD5;stroke-width:2}
    .edge.async{stroke-dasharray:5 4}
    .head{fill:#A3A6AE;stroke:#A3A6AE;stroke-width:1;stroke-linejoin:round}.head.hot{fill:#4F5BD5;stroke:#4F5BD5}
    .rule{stroke:#E6E7EA;stroke-width:1}
    .shadow{fill:#18191D;opacity:0.045}
    @media (prefers-color-scheme:dark){
      .bg,.elabel-bg{fill:#0F1013}
      .t{fill:#ECEDF0}
      .subtitle,.elabel{fill:#8F929C}
      .sub{fill:#8A8D97}.kind{fill:#5F626C}
      .node{fill:#17181C;stroke:#2C2E35}
      .node.ext{fill:#0F1013;stroke:#4A4D56}
      .node.hot{stroke:#8C95FF}
      .node.crit{fill:#2A1715;stroke:#F0675A}
      .node.high{fill:#2A1E12;stroke:#F0954A}
      .node.ok{fill:#13231A;stroke:#4CC07D}
      .dot.crit{fill:#F0675A}.dot.high{fill:#F0954A}.dot.med{fill:#E2B93B}.dot.ok{fill:#4CC07D}.dot.info{fill:#6FA2F0}
      .edge{stroke:#5A5D66}.edge.hot{stroke:#8C95FF}
      .head{fill:#5A5D66;stroke:#5A5D66}.head.hot{fill:#8C95FF;stroke:#8C95FF}
      .rule{stroke:#23252B}
      .shadow{fill:#000;opacity:0.35}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M2 2.5 L10.5 6 L2 9.5 Z"/></marker>
    <marker id="arrow-hot" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head hot" d="M2 2.5 L10.5 6 L2 9.5 Z"/></marker>
  </defs>

  <rect class="bg" width="920" height="392"/>

  <!-- header -->
  <text class="t title" x="40" y="52">Auth: keep cookie sessions or move to JWT</text>
  <text class="t subtitle" x="40" y="74">Read left to right; diamonds are triggers. Highlighted path = recommended.</text>

  <!-- edges: path B (normal) first, then path A (hot) on top -->
  <path class="edge" d="M216 212 H244 Q252 212 252 220 V266 Q252 274 260 274 H282" marker-end="url(#arrow)"/>
  <path class="edge" d="M464 274 H546"/>
  <path class="edge" d="M558 274 H634" marker-end="url(#arrow)"/>
  <path class="edge hot" d="M216 212 H244 Q252 212 252 204 V158 Q252 150 260 150 H282" marker-end="url(#arrow-hot)"/>
  <path class="edge hot" d="M464 150 H546"/>
  <path class="edge hot" d="M558 150 H634" marker-end="url(#arrow-hot)"/>

  <!-- divergence points -->
  <path class="node hot" d="M552 144 L558 150 L552 156 L546 150 Z"/>
  <text class="t elabel" x="552" y="134" text-anchor="middle">if we ship a mobile app</text>
  <path class="node" d="M552 268 L558 274 L552 280 L546 274 Z"/>
  <text class="t elabel" x="552" y="258" text-anchor="middle">if we need instant logout</text>

  <!-- start -->
  <rect class="shadow" x="40" y="184" width="176" height="60" rx="10"/>
  <rect class="node hot" x="40" y="182" width="176" height="60" rx="10"/>
  <text class="t label" x="60" y="209">Cookie sessions</text>
  <text class="t sub" x="60" y="227">auth today</text>

  <!-- path A -->
  <rect class="shadow" x="288" y="122" width="176" height="60" rx="10"/>
  <rect class="node ok" x="288" y="120" width="176" height="60" rx="10"/>
  <circle class="dot ok" cx="448" cy="134" r="4"/>
  <text class="t label" x="308" y="147">Keep sessions</text>
  <text class="t sub" x="308" y="165">path A: low risk</text>

  <rect class="shadow" x="640" y="122" width="240" height="60" rx="10"/>
  <rect class="node ok" x="640" y="120" width="240" height="60" rx="10"/>
  <circle class="dot ok" cx="864" cy="134" r="4"/>
  <text class="t label" x="660" y="147">Add tokens for mobile</text>
  <text class="t sub" x="660" y="165">fine: web keeps sessions</text>

  <!-- path B -->
  <rect class="shadow" x="288" y="246" width="176" height="60" rx="10"/>
  <rect class="node high" x="288" y="244" width="176" height="60" rx="10"/>
  <circle class="dot high" cx="448" cy="258" r="4"/>
  <text class="t label" x="308" y="271">Move to JWT</text>
  <text class="t sub" x="308" y="289">path B: can't revoke</text>

  <rect class="shadow" x="640" y="246" width="240" height="60" rx="10"/>
  <rect class="node crit" x="640" y="244" width="240" height="60" rx="10"/>
  <circle class="dot crit" cx="864" cy="258" r="4"/>
  <text class="t label" x="660" y="271">Add a denylist</text>
  <text class="t sub" x="660" y="289">= sessions again</text>

  <!-- legend -->
  <line class="rule" x1="40" y1="336" x2="880" y2="336"/>
  <path class="edge hot" d="M40 362 H68"/>
  <text class="t elabel" x="76" y="366">recommended path</text>
  <path class="node" d="M208 356 L214 362 L208 368 L202 362 Z"/>
  <text class="t elabel" x="222" y="366">trigger</text>
  <circle class="dot ok" cx="285" cy="362" r="4"/>
  <text class="t elabel" x="295" y="366">fine</text>
  <circle class="dot high" cx="343" cy="362" r="4"/>
  <text class="t elabel" x="353" y="366">high: JWTs can't be revoked</text>
  <circle class="dot crit" cx="529" cy="362" r="4"/>
  <text class="t elabel" x="539" y="366">critical: denylist rebuilds sessions, plus JWT</text>
</svg>
