[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walkthrough-generator"
version = "0.1.0"
description = "Narrated walkthrough videos for CLI and web apps"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx>=0.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
walkthrough = "walkthrough.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["walkthrough"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
